<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Beacon Engine</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; padding: 24px 16px; background-color: #0b0f19; color: #f3f4f6; margin: 0; }
        h2 { font-size: 22px; margin-bottom: 4px; color: #ffffff; letter-spacing: -0.5px; }
        .subtitle { font-size: 14px; color: #9ca3af; margin-top: 0; margin-bottom: 28px; }
        .card { background: #1f2937; border-radius: 16px; padding: 20px; margin-bottom: 16px; border: 1px solid #374151; text-align: left; }
        .card-label { font-size: 13px; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 8px; }
        button { width: 100%; padding: 16px; font-size: 16px; font-weight: 600; border-radius: 12px; border: none; margin: 8px 0; cursor: pointer; transition: background 0.2s; }
        .btn-auth { background-color: #2563eb; color: white; }
        .btn-picker { background-color: #10b981; color: white; display: none; } /* Hidden until logged in */
        .btn-trigger { background-color: #dc2626; color: white; font-size: 18px; margin-top: 24px; box-shadow: 0 4px 20px rgba(220, 38, 38, 0.3); }
        #live-camera { display: none; }
        #auth-status { font-size: 15px; color: #ef4444; font-weight: 500; margin-bottom: 10px; }
        #folder-status { font-size: 14px; color: #9ca3af; font-weight: 500; margin-top: 4px; word-break: break-all; }
        #broadcast-status { font-size: 14px; font-weight: 500; color: #f59e0b; margin-top: 12px; }
    </style>

    
    <script src="https://google.com" async defer></script>
    <script src="https://google.com" async defer></script>
</head>
<body>

    <h2>System Console</h2>
    <p class="subtitle">Secure Telemetry Router</p>

    <!-- Step A: Google Auth -->
    <div class="card">
        <span class="card-label">Authentication Hook</span>
        <div id="auth-status">Status: Disconnected</div>
        <button class="btn-auth" onclick="initiateGoogleLogin()">Authorize Google Identity</button>
    </div>

    <!-- Step B: Picker Target Folder Interface -->
    <div class="card">
        <span class="card-label">Target Destination</span>
        <button id="picker-btn" class="btn-picker" onclick="openGoogleFolderPicker()">📁 Select or Create Drive Folder</button>
        <div id="folder-status">No target folder selected. Dispatches will route to Root directory by default.</div>
    </div>

    <video id="live-camera" autoplay playsinline></video>

    <!-- Step C: Trigger Engine -->
    <button class="btn-trigger" onclick="triggerEmergencyBroadcast()">SEND TELEMETRY ALERT</button>
    <div id="broadcast-status"></div>

    <script src="code.js"></script>

    <script>
        // Start background media stream
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } }).then(stream => {
            document.getElementById('live-camera').srcObject = stream;
        }).catch(err => console.log("Camera hardware standalone tracking context fallback."));

        // Global Configuration Variables
        const GOOGLE_CLIENT_ID = 'YOUR_GOOGLE_CLIENT_://googleusercontent.com'; // <-- Paste your Client ID string here
        const GOOGLE_DEVELOPER_KEY = 'YOUR_GOOGLE_DEVELOPER_KEY';                  // <-- Paste your API Key here

        let tokenClient;
        function initiateGoogleLogin() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: GOOGLE_CLIENT_ID,
                scope: 'https://googleapis.com https://googleapis.com',
                callback: handleCredentialResponse
            });
            tokenClient.requestAccessToken();
        }

        // Initialize Google Picker Architecture
        function loadGoogleApis() {
            gapi.load('picker', {'callback': () => console.log("Picker API loaded successfully.")});
        }
        window.addEventListener('load', loadGoogleApis);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
            });
        }
    </script>
</body>
</html>
